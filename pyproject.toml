[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "air-quality-modeling"
version = "0.1.0"
description = "Air pollution dispersion and source inversion"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
air-quality-modeling = "air_quality.cli:main"

[tool.setuptools]
packages = ["air_quality"]
